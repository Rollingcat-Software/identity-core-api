spring:
  application:
    name: fivucsas-identity-core-api-test

  # Disable Flyway for tests - use Hibernate ddl-auto instead
  flyway:
    enabled: false

  # H2 In-Memory Database for Testing
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA/Hibernate Configuration for Testing
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    defer-datasource-initialization: true

  # SQL Initialization - run data.sql after schema creation
  sql:
    init:
      mode: always

  # H2 Console (disabled in test)
  h2:
    console:
      enabled: false

  # Disable security for testing
  security:
    user:
      name: test
      password: test

# JWT Configuration for Testing
# Base64-encoded secret (represents 256-bit key for HMAC-SHA256)
jwt:
  secret: dGhpc2lzYXRlc3RzZWNyZXRrZXl0aGF0aXNsb25nZW5vdWdoZm9ydGVzdGluZw==
  expiration: 3600000  # 1 hour in milliseconds
  refresh-expiration: 86400000  # 24 hours in milliseconds

# CORS Configuration for Testing
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Biometric Service Configuration for Testing
biometric:
  service:
    url: http://localhost:8000  # Mock/Test biometric service
    timeout: 5000

# Logging Configuration for Tests
logging:
  level:
    root: INFO
    com.fivucsas.identity: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
