spring:
  application:
    name: fivucsas-identity-core-api-integration-test

  # PostgreSQL via Testcontainers (URL overridden by @DynamicPropertySource)
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none       # Flyway manages schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Test-only fixtures live in db/test-fixtures and are NOT on the prod
    # classpath. Two fixtures currently:
    #   - V28_5__align_default_login_flow_for_v29.sql back-fills the
    #     hardcoded UUIDs that V29 references (see fixture file header).
    #   - V39_5__rename_audit_logs_pkey_for_v40.sql frees the
    #     audit_logs_pkey constraint name so V40's composite-PK ADD does
    #     not collide on a fresh Testcontainers DB (prod skipped V40 via
    #     a BASELINE marker so it never hit the collision; CI runs V40
    #     end-to-end so it does).
    locations: classpath:db/migration,classpath:db/test-fixtures
    baseline-on-migrate: false
    validate-on-migrate: true

  # Disable H2 console
  h2:
    console:
      enabled: false

  # Disable SQL init (Flyway handles it)
  sql:
    init:
      mode: never

  # Redis — disabled for integration tests (no container; use no-op/mock)
  data:
    redis:
      host: localhost
      port: 6379

  # Disable mail auto-configuration noise
  mail:
    host: localhost
    port: 2525
    username: test
    password: test

# JWT Configuration (same secret as test profile)
jwt:
  secret: dGhpc2lzYXRlc3RzZWNyZXRrZXl0aGF0aXNsb25nZW5vdWdoZm9ydGVzdGluZw==
  expiration: 3600000        # 1 hour
  refresh-expiration: 86400000  # 24 hours

# BE-H3: test-only KEK for TotpSecretCipher
fivucsas:
  totp:
    enc-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    migrate-on-boot: false

# Integration profile: HS512 stays on so legacy fixture tokens still
# round-trip in @SpringBootTest paths; prod-mode is asserted by unit tests.
app:
  security:
    jwt:
      allow-hs512: true
      issuer: ""

# Disable Redis event bus (no Redis container in integration tests)
redis:
  host: localhost
  port: 6379
  password: ""
  database: 0
  event-bus:
    enabled: false

# Biometric service — not available during integration tests
biometric:
  service:
    url: http://localhost:8001
    timeout: 5000
    api-key: test-key

# Disable email sending
mail:
  enabled: false

# Disable SMS sending
sms:
  enabled: false

# CORS
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

# Logging
logging:
  level:
    root: WARN
    com.fivucsas.identity: DEBUG
    org.flywaydb: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.testcontainers: INFO

# Swagger
springdoc:
  swagger-ui:
    enabled: false
