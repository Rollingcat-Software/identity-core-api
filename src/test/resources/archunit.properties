# ArchUnit test-time config.
#
# `freeze.store.default.path` — directory where FreezingArchRule writes its baseline.
# Resolved relative to the surefire working directory (project root). Committed to git
# so CI has a stable snapshot; see UserDomainBoundaryTest for context.
freeze.store.default.path=archunit_store

# `freeze.refreeze=false` — fail on new violations rather than silently rewriting the
# baseline. Operators wanting to refresh the snapshot after a real migration should
# instead manually edit / delete the violation line, OR run once with
# -Darchunit.freeze.refreeze=true.
freeze.refreeze=false

# `freeze.store.default.allowStoreCreation=true` — first run on a fresh checkout is
# allowed to create the store. After that, the file lives in git.
freeze.store.default.allowStoreCreation=true

# `freeze.store.default.allowStoreUpdate=true` — needed when a violation is removed
# (real migration shrinks the baseline). New violations still fail because of
# `freeze.refreeze=false` above.
freeze.store.default.allowStoreUpdate=true
