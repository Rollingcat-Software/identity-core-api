# Production Profile Configuration
# SECURITY: This profile enforces production security standards

spring:
  application:
    name: identity-core-api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  # PostgreSQL Database (Production)
  # IMPORTANT: Configure these via environment variables
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Hard upper bound on every query at the PostgreSQL session level (30s).
      # Prevents a single runaway query from holding a Hikari connection
      # indefinitely. Override per-connection if needed via env.
      connection-init-sql: ${DB_CONNECTION_INIT_SQL:SET statement_timeout = 30000}

  # Flyway (Production)
  # validate-on-migrate: TRUE enforces migration-checksum integrity. If a
  # migration file is mutated post-apply or a migration is missing locally, the
  # app refuses to boot. Operator override: set
  # SPRING_FLYWAY_VALIDATE_ON_MIGRATE=false in .env.prod for emergency rollback.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:true}

  # H2 Console (DISABLED in production for security)
  h2:
    console:
      enabled: false

  # JPA/Hibernate (Production)
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # Never auto-create schema in production
    show-sql: false  # Don't log SQL in production
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

# CORS + WebAuthn + JWT-validation config (Production)
# Single `app:` block — Spring's YAML loader rejects duplicate top-level keys.
app:
  # Public base URL of the web dashboard — used to build the guest
  # accept-invitation link emailed to recipients. Override with
  # APP_FRONTEND_BASE_URL in .env.prod if the dashboard host changes.
  frontend-base-url: ${APP_FRONTEND_BASE_URL:https://app.fivucsas.com}
  # Identity / account-linking (Model A). Phase 4 OIDC `sub` alignment ships
  # DORMANT in prod: default OFF so `sub` stays = users.id (zero behaviour
  # change). When true, `sub` is an identity-derived PAIRWISE pseudonym per RP
  # (OIDC Core §8). Soak in staging before flipping; flipping rotates every RP's
  # view of `sub`. Salt MUST be set (and kept stable) when enabling.
  identity:
    oidc-subject-identity: ${APP_IDENTITY_OIDC_SUBJECT_IDENTITY:false}
    pairwise-salt: ${APP_IDENTITY_PAIRWISE_SALT:}
    # Phase 5 in-session membership switch. Default OFF (frictionless — ownership
    # proven at link time). Flip to true to require a fresh caller password on
    # every /auth/switch-membership before a token is minted.
    require-stepup-on-switch: ${APP_IDENTITY_REQUIRE_STEPUP_ON_SWITCH:false}
  # Config-driven login engine (task #16). Ships DARK in prod: default OFF so the
  # whole login path is byte-identical to today (hard password gate; usernameless
  # entry points mint directly). KILL-SWITCH / CANARY — no redeploy to flip:
  #   APP_AUTH_CONFIG_DRIVEN_LOGIN=true            → enable for ALL tenants
  #   APP_AUTH_CONFIG_DRIVEN_LOGIN_TENANTS=<uuid>  → canary specific tenant(s)
  # Roll out: dark → staging soak → canary one tenant → global. Revert = unset.
  auth:
    config-driven-login: ${APP_AUTH_CONFIG_DRIVEN_LOGIN:false}
    config-driven-login-tenants: ${APP_AUTH_CONFIG_DRIVEN_LOGIN_TENANTS:}
    # Tenant Auth-Methods true-gate kill-switch. Default ON (the gate enforces).
    # APP_AUTH_ENFORCE_TENANT_AUTH_METHODS=false disables login-time enforcement
    # instantly with no redeploy if the gate ever misbehaves in prod.
    enforce-tenant-auth-methods: ${APP_AUTH_ENFORCE_TENANT_AUTH_METHODS:true}
  # GDPR Art. 17 / KVKK right-to-erasure — daily hard-purge of users
  # soft-deleted more than 30 days ago. Default flipped to true in the prod
  # profile (T2-E, INVESTIGATION_MASTER_2026-05-07 P1): the controlling
  # legitimate-interest-vs-erasure balance under Art. 17(1)(a/c) requires
  # actual deletion once the operator-validated retention window elapses.
  # Operator override: set APP_PURGE_SOFT_DELETE_ENABLED=false in .env.prod
  # for emergency suspension (audit trail in audit_logs.USER_HARD_PURGED
  # remains regardless — that table is FK ON DELETE SET NULL, V5).
  # The base application.yml retains a `false` default so non-prod profiles
  # do NOT silently purge dev data.
  purge:
    softDelete:
      enabled: ${APP_PURGE_SOFT_DELETE_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://api.fivucsas.com,https://app.fivucsas.com,https://demo.fivucsas.com,https://verify.fivucsas.com}
  # WebAuthn allowed RP origins (P1-2). Production never includes localhost.
  webauthn:
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:https://app.fivucsas.com,https://verify.fivucsas.com,https://demo.fivucsas.com}
  # SECURITY_REVIEW_2026-05-01 §P0-3 / §P2-3:
  # - allow-hs512: HS512 verification OFF in prod once 30-day soak completes.
  # - issuer: pinned so tokens forged against a different deployment's RSA key
  #   (e.g. staging) are rejected at the parser, not just at signature time.
  # SECURITY_REVIEW / BACKEND_REVIEW 2026-05-12 §aud-claim / §P1:
  # - audience: every minted access token carries `aud=fivucsas-api`; the
  #   parser rejects tokens whose audience does not contain it. Closes the
  #   RFC 7519 §4.1.3 binding gap that memory missed three times.
  # - allow-hs512: pinned to false explicitly (was relying on application.yml
  #   default). The leaked f8ee668:.env.gcp HS secret is no longer a forge
  #   surface even if APP_SECURITY_JWT_ALLOW_HS512 is unset in .env.prod.
  # - revoked-kids: explicit defence-in-depth for the leaked hs-2026-04 kid.
  #   Any JWT carrying that kid is rejected during validation regardless of
  #   allow-hs512 state.
  security:
    jwt:
      allow-hs512: false
      issuer: ${APP_SECURITY_JWT_ISSUER:https://api.fivucsas.com}
      audience: ${APP_SECURITY_JWT_AUDIENCE:fivucsas-api}
      revoked-kids: ${APP_SECURITY_JWT_REVOKED_KIDS:hs-2026-04}

# JWT Configuration (Production)
# CRITICAL: JWT secret MUST come from environment variable (see JwtSecretProvider)
# T-P1-SEC Fix A (2026-05-07): access-token TTL hardened from 1h → 15min in prod.
# Refresh-token rotation + family-revoke (V55) keeps UX silent: clients use the
# refresh endpoint to mint a fresh access token before expiry. Smaller TTL =
# smaller blast radius if an access token leaks.
jwt:
  expiration: ${JWT_EXPIRATION:900000}  # Default 15 minutes, override via env var
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}  # Default 24 hours

# AUDIT_2026-04-28_SECURITY.md SEC-P1 #3: lock prod signing algorithm to
# RS256. The base application.yml defaults to ${JWT_DEFAULT_ALGO:HS512},
# leaving prod posture dependent on whether .env.prod overrides correctly.
# Hard-code RS256 here so the prod profile is RS256 even if the env var
# is missing. JwtService also asserts this on startup when "prod" is
# active — see JwtService#assertProdAlgoIsRs256.
fivucsas:
  jwt:
    default-algo: RS256

# FastAPI Integration (Production)
# IMPORTANT: Configure via environment variables
biometric:
  service:
    url: ${BIOMETRIC_SERVICE_URL:http://biometric-processor:8001}
    timeout: ${BIOMETRIC_SERVICE_TIMEOUT:30000}
    api-key: ${BIOMETRIC_SERVICE_API_KEY:}

# Logging (Production)
# Only log warnings and errors, no sensitive data
logging:
  level:
    com.fivucsas: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    # %X{requestId} is populated by RequestIdFilter (P2.8b). Falls back to "-"
    # when the log line is emitted off-thread (e.g. background task).
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId:--}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId:--}] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/fivucsas/identity-core-api.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# Server Configuration (Production)
server:
  port: ${PORT:8080}
  error:
    include-message: never  # Security: Don't expose internal errors
    include-binding-errors: never
    include-stacktrace: never
  compression:
    enabled: true
  http2:
    enabled: true
  shutdown: graceful

# Spring Boot Actuator (Production)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never  # Don't expose internal details
  metrics:
    export:
      prometheus:
        enabled: true

# Swagger/OpenAPI — filtered public docs (developer surface only)
# Admin endpoints (tenants, users, roles, audit-logs, admin/*, oauth2/clients, actuator)
# are hidden to avoid exposing internal management API surface.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    try-it-out-enabled: true
  paths-to-exclude:
    - /api/v1/admin/**
    - /api/v1/tenants/**
    - /api/v1/users/**
    - /api/v1/roles/**
    - /api/v1/audit-logs/**
    - /api/v1/oauth2/clients/**
    - /actuator/**
  show-actuator: false

# Security Headers (Production)
security:
  headers:
    content-security-policy: "default-src 'self'"
    x-frame-options: DENY
    x-content-type-options: nosniff
    strict-transport-security: max-age=31536000; includeSubDomains
