# Development Profile Configuration
# This profile is for LOCAL DEVELOPMENT ONLY
# DO NOT use this profile in production

spring:
  application:
    name: identity-core-api-dev

  # H2 In-Memory Database (Development Only)
  datasource:
    url: jdbc:h2:mem:fivucsas_dev_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console (Development only - requires authentication)
  # SECURITY: Disabled by default, enable via H2_CONSOLE_ENABLED=true env var
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false  # Security: Only localhost access
        trace: false  # Security: Disable SQL tracing

  # Disable Flyway for H2 development (use Hibernate ddl-auto instead)
  flyway:
    enabled: false

  # JPA/Hibernate (Development)
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop  # Recreate schema on restart (dev only)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  # SQL Initialization - run data.sql after schema creation
  sql:
    init:
      mode: always

# JWT Configuration (Development)
# WARNING: In development, secret can be in config, but MUST use env var in production
jwt:
  secret: ZGV2ZWxvcG1lbnRzZWNyZXRrZXlmb3Jsb2NhbHRlc3Rpbmdvbmx5bm90Zm9ycHJvZA==
  expiration: 86400000  # 24 hours
  refresh-expiration: 604800000  # 7 days

# Redis Configuration (Development)
# SECURITY: Password must be set via REDIS_PASSWORD environment variable
redis:
  host: localhost
  port: 6379
  password: ${REDIS_PASSWORD:}
  database: 0
  event-bus:
    enabled: true

# FastAPI Integration (Development)
biometric:
  service:
    url: http://localhost:8001
    timeout: 30000

# Logging (Verbose for development)
logging:
  level:
    com.fivucsas: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always  # Development only

# CORS Configuration (Development)
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:4200
