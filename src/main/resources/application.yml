# Default Configuration
# This file contains common configuration shared across all profiles
# Profile-specific overrides: application-dev.yml, application-prod.yml
#
# SECURITY NOTICE:
# - JWT secret MUST be provided via JWT_SECRET environment variable
# - DO NOT put secrets in this file or any config file
# - Use profiles: 'dev' for development, 'prod' for production
#
# To activate a profile:
#   Development: --spring.profiles.active=dev
#   Production:  --spring.profiles.active=prod

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # Default to dev if not specified

  application:
    name: identity-core-api

# Redis Configuration
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DB:0}
  event-bus:
    enabled: ${REDIS_EVENT_BUS_ENABLED:true}

# Email / SMTP Configuration
mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:noreply@fivucsas.com}
  enabled: ${MAIL_ENABLED:false}

# JWT Configuration
# CRITICAL SECURITY: Secret must come from JWT_SECRET environment variable (enforced by JwtSecretProvider)
jwt:
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours default
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days default

# FastAPI Integration
biometric:
  service:
    url: ${BIOMETRIC_SERVICE_URL:http://localhost:8001}
    timeout: ${BIOMETRIC_SERVICE_TIMEOUT:30000}
    api-key: ${BIOMETRIC_SERVICE_API_KEY:}

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}  # Can disable in production

# Server
server:
  port: ${PORT:8080}
  error:
    include-message: ${ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${ERROR_INCLUDE_BINDING:never}

# Management and Monitoring (Actuator + Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:when-authorized}
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:dev}
