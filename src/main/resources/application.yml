# Default Configuration
# This file contains common configuration shared across all profiles
# Profile-specific overrides: application-dev.yml, application-prod.yml
#
# SECURITY NOTICE:
# - JWT secret MUST be provided via JWT_SECRET environment variable
# - DO NOT put secrets in this file or any config file
# - Use profiles: 'dev' for development, 'prod' for production
#
# To activate a profile:
#   Development: --spring.profiles.active=dev
#   Production:  --spring.profiles.active=prod

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # Default to dev if not specified

  application:
    name: identity-core-api

# GDPR Art. 17 / KVKK right-to-erasure. Permanently purges users soft-deleted more
# than 30 days ago. DISABLED by default — operator must validate via
# `DELETE /api/v1/admin/purge/dry-run` before flipping to true per environment.
app:
  # Public base URL of the web dashboard (React). Used to build user-facing
  # links emailed to recipients — e.g. the guest accept-invitation link
  # ({frontend-base-url}/accept-invite?token=...). Override per environment
  # with APP_FRONTEND_BASE_URL.
  frontend-base-url: ${APP_FRONTEND_BASE_URL:https://app.fivucsas.com}
  # Identity / account-linking layer (Model A — docs/IDENTITY_ACCOUNT_LINKING_DESIGN.md).
  identity:
    # Phase 4 (LAST, widest blast radius — ships DORMANT). When false (default)
    # the OIDC `sub` claim and the /oauth2/userinfo subject are EXACTLY as today
    # (= users.id). When true, `sub` becomes an identity-derived PAIRWISE
    # pseudonymous id per relying party (OIDC Core §8): the same person presents
    # a stable `sub` to a given RP across all their tenant accounts, while
    # different RPs get unlinkable subs. Does NOT touch the dashboard's own
    # access-token subject (that stays the user principal). Flip to true ONLY
    # after soaking in staging — changing it rotates every RP's view of `sub`.
    oidc-subject-identity: ${APP_IDENTITY_OIDC_SUBJECT_IDENTITY:false}
    # Per-environment salt mixed into the pairwise `sub` hash (one-way SHA-256 of
    # sector + identity_id + salt). Keep stable + secret; rotating it rotates
    # every pairwise `sub`. Only consulted when oidc-subject-identity=true.
    pairwise-salt: ${APP_IDENTITY_PAIRWISE_SALT:}
    # Phase 5 (in-session membership switch — POST /api/v1/auth/switch-membership).
    # When false (default), an authenticated person may assume another of THEIR
    # OWN linked memberships without re-entering credentials (ownership is already
    # proven at link time). When true, the switch additionally requires a fresh
    # password in the request body (verified against the CALLER) before a token is
    # minted — limits blast radius if one session is stolen, since a switch can
    # reach a higher-privileged linked membership. v1 ships default-false.
    require-stepup-on-switch: ${APP_IDENTITY_REQUIRE_STEPUP_ON_SWITCH:false}
  # Config-driven login engine (task #16). Ships DARK — default FALSE so the
  # entire login path is byte-identical to the legacy password-first behavior
  # (hard password gate stays; usernameless entry points mint tokens directly).
  # Operator kill-switch / canary, no redeploy needed to flip:
  auth:
    # Master switch. When true the tenant's default APP_LOGIN flow drives login:
    # the hard password gate is replaced by the configured Layer-1 method, and
    # passkey / approve-login / QR usernameless logins hand off into the flow
    # (MFA_PENDING when Layer-2+ steps remain). Flip back to false to instantly
    # restore legacy behavior.
    config-driven-login: ${APP_AUTH_CONFIG_DRIVEN_LOGIN:false}
    # Per-tenant CANARY: comma-separated tenant UUIDs that get the new engine
    # even while the master switch is false. Lets one tenant be validated in
    # production before the global flip. Invalid UUIDs are skipped with a warn
    # (never widens the rollout / crashes startup).
    config-driven-login-tenants: ${APP_AUTH_CONFIG_DRIVEN_LOGIN_TENANTS:}
  # Public self-service tenant onboarding (POST /api/v1/onboarding/register).
  onboarding:
    # Master switch for the public endpoint. When false the endpoint returns 400.
    enabled: ${APP_ONBOARDING_ENABLED:true}
    # When true, self-onboarded tenants stay PENDING for a ROOT (platform owner) to approve
    # even AFTER the admin verifies their email. When false (default) email
    # verification alone activates the (capped TRIAL) tenant.
    require-admin-approval: ${APP_ONBOARDING_REQUIRE_ADMIN_APPROVAL:false}
    # Seat cap applied to a freshly self-onboarded TRIAL tenant. The cap is lifted
    # only after domain verification (Round-2 DNS-TXT) or ROOT promotion.
    trial-max-users: ${APP_ONBOARDING_TRIAL_MAX_USERS:25}
    # Personal / free / disposable email providers that may NOT onboard a tenant
    # (a real org signs up with its own corporate domain → 422). Comma-separated;
    # an entry ending in a dot (e.g. "gmx.") matches that label + any TLD.
    # NOTE: deliberately NOT set here — the rich default lives on the @Value in
    # RegisterTenantService so the list ships out of the box. Set the env var
    # APP_ONBOARDING_BLOCKED_EMAIL_DOMAINS only to REPLACE it (a blank value
    # here would override the code default with an empty list — same trap as
    # APP_SECURITY_JWT_AUDIENCE).
  purge:
    softDelete:
      enabled: ${APP_PURGE_SOFT_DELETE_ENABLED:false}
  # WebAuthn allowed RP origins (P1-2). Exact-match, case-sensitive (RFC 6454 §4).
  # Any origin not in this list is rejected. Override with WEBAUTHN_ALLOWED_ORIGINS
  # (comma-separated) per environment. Default profile retains prod hosts plus
  # localhost for dev convenience — DO NOT add localhost to application-prod.yml.
  webauthn:
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:https://app.fivucsas.com,https://verify.fivucsas.com,https://demo.fivucsas.com,http://localhost:5173,http://localhost:8080}
  # HS512 key registry (parallel-verify rotation). The active kid is stamped on
  # every newly-signed HS512 token; retired kids stay in the verification set
  # until their tokens age out. Per-kid secrets are read from environment vars
  # named `JWT_HS_KEY_<KID_UPPER_DASHES_TO_UNDERSCORES>` — adding a new kid is
  # config-only (operator mints the secret + sets the env, then later flips
  # `active-hs-kid`). Backward compat: when the active kid's env var is unset,
  # the registry falls back to the legacy `JWT_SECRET`.
  security:
    jwt:
      active-hs-kid: ${APP_SECURITY_JWT_ACTIVE_HS_KID:hs-2026-04}
      retired-hs-kids: ${APP_SECURITY_JWT_RETIRED_HS_KIDS:}
      # SECURITY_REVIEW / BACKEND_REVIEW 2026-05-12 §aud-claim — bind the
      # RFC 7519 §4.1.3 audience claim on every minted access token. Empty
      # default in base config keeps dev/test parity with the existing
      # issuer config; application-prod.yml pins a real value and the
      # JwtService boot assertion enforces it for the prod profile.
      audience: ${APP_SECURITY_JWT_AUDIENCE:}
      # SECURITY_REVIEW 2026-05-12 §P1 — explicit kid revocation list.
      # Comma-separated. Any JWT carrying a kid in this set is rejected
      # during validation regardless of allow-hs512. Empty by default;
      # application-prod.yml revokes the leaked hs-2026-04 kid.
      revoked-kids: ${APP_SECURITY_JWT_REVOKED_KIDS:}
    # INVESTIGATION_MASTER_2026-05-07 §"user constraints":
    # cap on active devices a single user may register. WebAuthn allowList
    # bloat (the per-user list of credentialIds the browser must include in
    # every authentication request) was unbounded; ~10 devices is the
    # practical ceiling beyond which the assertion blob becomes wire-heavy
    # and credentials.get() picker UX degrades.
    max-devices-per-user: ${APP_SECURITY_MAX_DEVICES_PER_USER:10}
    # #11 (2026-05-21): cap inbound voice-enrollment payloads. max-voice-bytes
    # is the decoded byte ceiling (default 10 MB, matching the prod servlet
    # max-file-size); max-voice-enrollments-per-user caps how many VOICE
    # enrollments a single user may hold (mirrors max-devices-per-user).
    max-voice-bytes: ${APP_SECURITY_MAX_VOICE_BYTES:10485760}
    max-voice-enrollments-per-user: ${APP_SECURITY_MAX_VOICE_ENROLLMENTS_PER_USER:5}

# Redis Configuration
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DB:0}
  event-bus:
    enabled: ${REDIS_EVENT_BUS_ENABLED:true}

# Email / SMTP Configuration
mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:noreply@fivucsas.com}
  enabled: ${MAIL_ENABLED:false}

# SMS Gateway
sms:
  enabled: ${SMS_ENABLED:false}
  provider: ${SMS_PROVIDER:noop}  # noop, twilio, or netgsm
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  netgsm:
    usercode: ${NETGSM_USERCODE:}
    password: ${NETGSM_PASSWORD:}
    msgheader: ${NETGSM_MSGHEADER:FIVUCSAS}

# JWT Configuration
# CRITICAL SECURITY: Secret must come from JWT_SECRET environment variable (enforced by JwtSecretProvider)
jwt:
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours default
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days default

# FIVUCSAS application-level knobs
# BE-H1 dual-algo JWT coexistence:
#   default-algo selects the algorithm used to SIGN new tokens.
#     HS512 = legacy symmetric (default during coexistence window)
#     RS256 = asymmetric, OIDC best practice (flip after soak)
#   Verification always accepts BOTH HS512 and RS256 via kid lookup.
#   RSA keys are loaded from JWT_RSA_PRIVATE_KEY_PEM / JWT_RSA_PUBLIC_KEY_PEM env vars
#   (required in prod; auto-generated in dev profile).
fivucsas:
  jwt:
    default-algo: ${JWT_DEFAULT_ALGO:HS512}
    rsa-kid: ${JWT_RSA_KID:rs-2026-04}
    rsa-private-key-pem: ${JWT_RSA_PRIVATE_KEY_PEM:}
    rsa-public-key-pem: ${JWT_RSA_PUBLIC_KEY_PEM:}
  # BE-H3 (AUDIT_2026-04-19): TOTP shared-secret at-rest encryption.
  # enc-key: base64 32 bytes; app refuses to boot without it.
  # migrate-on-boot: gates TotpSecretMigrator (legacy plaintext → enc:v1:...).
  # Generate: openssl rand -base64 32
  totp:
    enc-key: ${FIVUCSAS_TOTP_ENC_KEY:}
    migrate-on-boot: ${FIVUCSAS_TOTP_MIGRATE_ON_BOOT:false}
    # S14 (security review): when true, decryptIfNeeded() throws on a plaintext
    # (un-encrypted) TOTP secret instead of silently accepting it. Enable once
    # the legacy plaintext rows have been migrated (see migrate-on-boot).
    reject-plaintext: ${FIVUCSAS_TOTP_REJECT_PLAINTEXT:false}
  # S9 (security review): NFC_DOCUMENT serial-only verification is security
  # theater — a card serial is readable/cloneable, not a secret. The step is
  # fail-closed by default (returns FAILED regardless of serial match) until
  # genuine on-chip authentication (ICAO passive auth) is implemented. Set to
  # true ONLY as an explicit, documented-risk opt-in to restore the legacy
  # serial-match behavior; keep false in production.
  nfc:
    serial-only-auth-enabled: ${FIVUCSAS_NFC_SERIAL_ONLY_AUTH_ENABLED:false}

# FastAPI Integration
biometric:
  service:
    url: ${BIOMETRIC_SERVICE_URL:http://localhost:8001/api/v1}
    timeout: ${BIOMETRIC_SERVICE_TIMEOUT:30000}
    api-key: ${BIOMETRIC_SERVICE_API_KEY:}

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}  # Can disable in production
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.fivucsas.identity.controller
  show-actuator: false

# Server
server:
  port: ${PORT:8080}
  error:
    include-message: ${ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${ERROR_INCLUDE_BINDING:never}

# Management and Monitoring (Actuator + Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:when-authorized}
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:dev}
