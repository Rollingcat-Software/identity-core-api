# Default Configuration
# This file contains common configuration shared across all profiles
# Profile-specific overrides: application-dev.yml, application-prod.yml
#
# SECURITY NOTICE:
# - JWT secret MUST be provided via JWT_SECRET environment variable
# - DO NOT put secrets in this file or any config file
# - Use profiles: 'dev' for development, 'prod' for production
#
# To activate a profile:
#   Development: --spring.profiles.active=dev
#   Production:  --spring.profiles.active=prod

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # Default to dev if not specified

  application:
    name: identity-core-api

# GDPR Art. 17 / KVKK right-to-erasure. Permanently purges users soft-deleted more
# than 30 days ago. DISABLED by default — operator must validate via
# `DELETE /api/v1/admin/purge/dry-run` before flipping to true per environment.
app:
  purge:
    softDelete:
      enabled: ${APP_PURGE_SOFT_DELETE_ENABLED:false}

# Audit-log partition runtime safety net (companion to V40/V41/V51).
# When true, AuditLogPartitionMaintenance:
#   - on @PostConstruct ensures current-month + next 2 months of audit_logs partitions exist.
#   - on a monthly @Scheduled cron creates any missing partition for the same look-ahead window.
# Set to false only when an external scheduler owns partition creation.
audit-log:
  partition:
    auto-create: ${AUDIT_LOG_PARTITION_AUTO_CREATE:true}

# Redis Configuration
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DB:0}
  event-bus:
    enabled: ${REDIS_EVENT_BUS_ENABLED:true}

# Email / SMTP Configuration
mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:noreply@fivucsas.com}
  enabled: ${MAIL_ENABLED:false}

# SMS Gateway
sms:
  enabled: ${SMS_ENABLED:false}
  provider: ${SMS_PROVIDER:noop}  # noop, twilio, or netgsm
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  netgsm:
    usercode: ${NETGSM_USERCODE:}
    password: ${NETGSM_PASSWORD:}
    msgheader: ${NETGSM_MSGHEADER:FIVUCSAS}

# JWT Configuration
# CRITICAL SECURITY: Secret must come from JWT_SECRET environment variable (enforced by JwtSecretProvider)
jwt:
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours default
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days default

# FIVUCSAS application-level knobs
# BE-H1 dual-algo JWT coexistence:
#   default-algo selects the algorithm used to SIGN new tokens.
#     HS512 = legacy symmetric (default during coexistence window)
#     RS256 = asymmetric, OIDC best practice (flip after soak)
#   Verification always accepts BOTH HS512 and RS256 via kid lookup.
#   RSA keys are loaded from JWT_RSA_PRIVATE_KEY_PEM / JWT_RSA_PUBLIC_KEY_PEM env vars
#   (required in prod; auto-generated in dev profile).
fivucsas:
  jwt:
    default-algo: ${JWT_DEFAULT_ALGO:HS512}
    rsa-kid: ${JWT_RSA_KID:rs-2026-04}
    rsa-private-key-pem: ${JWT_RSA_PRIVATE_KEY_PEM:}
    rsa-public-key-pem: ${JWT_RSA_PUBLIC_KEY_PEM:}
  # BE-H3 (AUDIT_2026-04-19): TOTP shared-secret at-rest encryption.
  # enc-key: base64 32 bytes; app refuses to boot without it.
  # migrate-on-boot: gates TotpSecretMigrator (legacy plaintext → enc:v1:...).
  # Generate: openssl rand -base64 32
  totp:
    enc-key: ${FIVUCSAS_TOTP_ENC_KEY:}
    migrate-on-boot: ${FIVUCSAS_TOTP_MIGRATE_ON_BOOT:false}

# FastAPI Integration
biometric:
  service:
    url: ${BIOMETRIC_SERVICE_URL:http://localhost:8001/api/v1}
    timeout: ${BIOMETRIC_SERVICE_TIMEOUT:30000}
    api-key: ${BIOMETRIC_SERVICE_API_KEY:}

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}  # Can disable in production
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.fivucsas.identity.controller
  show-actuator: false

# Server
server:
  port: ${PORT:8080}
  error:
    include-message: ${ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${ERROR_INCLUDE_BINDING:never}

# Management and Monitoring (Actuator + Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:when-authorized}
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:dev}
