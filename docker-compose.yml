# Identity Core API - Docker Compose for GCP Compute Engine (Ubuntu Linux)
# Production-ready deployment with PostgreSQL, Redis, and the API service.
#
# Usage:
#   1. Copy .env.example to .env and configure all values
#   2. docker compose up -d
#   3. Verify: docker compose ps && curl http://localhost:8080/actuator/health
#
# GCP Compute Engine requirements:
#   - Ubuntu 22.04+ LTS
#   - Docker Engine 24+ and Docker Compose v2
#   - Minimum: e2-medium (2 vCPU, 4 GB RAM)
#   - Recommended: e2-standard-2 (2 vCPU, 8 GB RAM) for production
#   - 20 GB SSD boot disk minimum

services:

  # ============================================================================
  # PostgreSQL 16 with pgvector extension
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: identity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-identity_core_db}
      POSTGRES_USER: ${DB_USERNAME:-identity_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - identity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-identity_admin} -d ${DB_NAME:-identity_core_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  # ============================================================================
  # Redis 7 for caching, sessions, and event bus
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: identity-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - identity-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M

  # ============================================================================
  # Identity Core API (Spring Boot)
  # ============================================================================
  identity-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identity-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Spring profile
      SPRING_PROFILES_ACTIVE: docker

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-identity_core_db}
      DB_USERNAME: ${DB_USERNAME:-identity_admin}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

      # JWT - MUST be set in production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Biometric processor (optional)
      BIOMETRIC_SERVICE_URL: ${BIOMETRIC_SERVICE_URL:-http://biometric-processor:8001}

      # JVM tuning for containers
      JAVA_OPTS: >-
        -Xms512m
        -Xmx1g
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:+HeapDumpOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - identity-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  identity-network:
    driver: bridge
