services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fivucsas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fivucsas
      POSTGRES_USER: fivucsas
      POSTGRES_PASSWORD: fivucsas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fivucsas -d fivucsas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fivucsas-net

  redis:
    image: redis:7-alpine
    container_name: fivucsas-redis
    restart: unless-stopped
    command: sh -c "redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_password}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_dev_password} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fivucsas-net

  identity-core-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fivucsas-identity-core-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-identity_core_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BIOMETRIC_SERVICE_URL: ${BIOMETRIC_SERVICE_URL:-http://biometric-processor:8001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fivucsas-net

volumes:
  pgdata:
  redisdata:

networks:
  fivucsas-net:
    driver: bridge



