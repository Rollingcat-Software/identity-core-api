name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven test (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        env:
          MAVEN_OPTS: -Xmx2g
        run: mvn -B -ntp -T 2C test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

  integration-tests:
    name: Integration tests (Testcontainers)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # P1-1 (2026-05-30): this job is now a BLOCKING / required check. It exists
    # to keep the tenant-isolation security guarantees under test on EVERY PR —
    # a security invariant that isn't tested every PR silently regresses.
    #
    # The `RUN_INTEGRATION=true` env below flips on the gated Testcontainers ITs
    # (each is `@EnabledIfEnvironmentVariable(named="RUN_INTEGRATION", matches="true")`),
    # and the `-Dtest=` filter in the run step now includes `*IT` so the
    # tenant-isolation / backfill IT classes actually execute (previously the
    # filter was `*IntegrationTest` only, which silently skipped every `*IT`).
    #
    # `continue-on-error` was REMOVED so a failing isolation IT fails the PR.
    # Branch protection on `main` must list "Integration tests (Testcontainers)"
    # as a required status check (operator GitHub-settings step — see PR body).
    #
    # The test sources hardcode `postgres:16-alpine` while Flyway V0 needs the
    # pgvector extension (prod runs pgvector/pgvector:pg16) — handled by the
    # retag step below.
    env:
      RUN_INTEGRATION: 'true'

    # Redis service for the @SpringBootTest integration classes (TOTP used-code
    # replay marker, rate-limit/cache). The `integration` profile points Redis at
    # localhost:6379; without a real Redis the auth-flow ITs threw
    # RedisConnectionException ("Unable to connect to localhost:6379"). Postgres
    # is provided per-class via Testcontainers; Redis is simplest as a GH service
    # (no extra Testcontainers dependency) and is prod-faithful (real Redis 7).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker is available (for Testcontainers)
        run: docker version && docker ps

      - name: Pull pgvector image and alias as postgres:16-alpine
        # Tests reference postgres:16-alpine but Flyway V0 requires the
        # pgvector extension (production runs pgvector/pgvector:pg16).
        # Self-hosted runner had a custom image baked in; ubuntu-latest does
        # not. Retag the public pgvector image so the test sources stay
        # unchanged.
        run: |
          docker pull pgvector/pgvector:pg16
          docker tag pgvector/pgvector:pg16 postgres:16-alpine

      - name: Run integration tests
        # `*IntegrationTest` = the existing Spring-context ITs (unchanged).
        # `*IT`              = the RUN_INTEGRATION-gated Testcontainers security/
        #                      backfill ITs that encode the tenant-isolation
        #                      guarantees and previously never ran in CI:
        #                      CrossTenantIsolationIT, TenantSwitcherIsolationIT,
        #                      IdentityBiometricConsentIT, IdentityBackfillIT,
        #                      RoleUnificationBackfillIT.
        # Passing an explicit -Dtest overrides surefire's default include glob,
        # so the `*IT` classes (which surefire would otherwise leave to failsafe)
        # are executed in the `test` phase. -DfailIfNoTests guards against the
        # filter silently matching nothing.
        env:
          MAVEN_OPTS: -Xmx2g
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        # -Djacoco.skip=true: this job runs only a SUBSET of tests, so the
        # jacoco `check` goal (bound to `verify`, baselined on the FULL unit run)
        # would fail on coverage. The unit `test` job above enforces the coverage
        # gate; here we only care that the isolation ITs pass.
        run: mvn -B -ntp -Dtest='*IntegrationTest,*IT' -DfailIfNoTests=true -Djacoco.skip=true verify

      - name: Assert tenant-isolation ITs actually executed (not skipped)
        # Defense against a silent regression where the ITs compile but get
        # skipped (e.g. RUN_INTEGRATION unset, or a rename drops them from the
        # filter). Each named IT must have produced a surefire report with at
        # least one run test and zero skips of the whole class.
        run: |
          set -euo pipefail
          reports=target/surefire-reports
          required=(
            CrossTenantIsolationIT
            TenantSwitcherIsolationIT
            IdentityBiometricConsentIT
            IdentityBackfillIT
            RoleUnificationBackfillIT
          )
          fail=0
          for it in "${required[@]}"; do
            # A class that uses JUnit 5 @Nested writes its tests to PER-NESTED-CLASS
            # surefire reports (TEST-...$it$Inner.xml) and leaves the top-level
            # TEST-...$it.xml report with tests="0". CrossTenantIsolationIT is such a
            # class, so we must SUM the test counts across the top-level report AND
            # every "$it$..." nested-class report, not just read the first match.
            # shellcheck disable=SC2206
            matches=( $(ls "$reports/TEST-com.fivucsas.identity."*".$it.xml" \
                           "$reports/TEST-com.fivucsas.identity."*".$it"'$'*".xml" \
                        2>/dev/null || true) )
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::$it produced no surefire report — it did NOT run (RUN_INTEGRATION gating or -Dtest filter broke)"
              fail=1
              continue
            fi
            tests=0
            for m in "${matches[@]}"; do
              n=$(grep -oP 'testsuite[^>]*\btests="\K[0-9]+' "$m" | head -1 || echo 0)
              tests=$((tests + ${n:-0}))
            done
            if [ "${tests:-0}" -lt 1 ]; then
              echo "::error::$it ran 0 tests (reports: ${matches[*]})"
              fail=1
            else
              echo "OK: $it executed ($tests test(s) across ${#matches[@]} report(s))"
            fi
          done
          exit $fail

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-integration
          path: target/surefire-reports/
          retention-days: 14
