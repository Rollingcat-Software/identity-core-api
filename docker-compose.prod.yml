services:
  identity-core-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identity-core-api
    restart: unless-stopped
    # Hardening (IN-H4 — 2026-04-19):
    # - read_only: rootfs is immutable; Spring Boot needs /tmp writable, so we
    #   tmpfs it (plus /var/log for occasional logback rotations).
    # - cap_drop ALL: nothing in this JVM workload needs linux capabilities.
    # - no-new-privileges: already in place.
    # If a future change requires writing to a path outside /tmp, add a tmpfs
    # entry rather than toggling read_only off.
    read_only: true
    tmpfs:
      - /tmp
      - /var/log
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://shared-postgres:5432/identity_core
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: shared-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: 0
      REDIS_TIMEOUT: 5000
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: 3600000
      JWT_REFRESH_TOKEN_EXPIRATION: 604800000
      JWT_ISSUER: rollingcat-identity-core
      JWT_AUDIENCE: rollingcat-clients
      JWT_DEFAULT_ALGO: ${JWT_DEFAULT_ALGO:-HS512}
      JWT_RSA_KID: ${JWT_RSA_KID:-}
      JWT_RSA_PRIVATE_KEY_PEM: ${JWT_RSA_PRIVATE_KEY_PEM:-}
      JWT_RSA_PUBLIC_KEY_PEM: ${JWT_RSA_PUBLIC_KEY_PEM:-}
      FIVUCSAS_TOTP_ENC_KEY: ${FIVUCSAS_TOTP_ENC_KEY:-}
      # PR #58 — alg/kid bind, iss/aud requireXxx, HS512 gating. The three vars
      # below are intentionally backward-compat during the 30-day soak; flip
      # all three together once existing refresh tokens have drained.
      APP_SECURITY_JWT_ALLOW_HS512: ${APP_SECURITY_JWT_ALLOW_HS512:-true}
      APP_SECURITY_JWT_ISSUER: ${APP_SECURITY_JWT_ISSUER:-}
      APP_SECURITY_JWT_AUDIENCE: ${APP_SECURITY_JWT_AUDIENCE:-}
      # PR #57 — WebAuthn origin allowlist (replaces substring `contains()` trick).
      WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-https://app.fivucsas.com,https://verify.fivucsas.com,https://demo.fivucsas.com}
      # Emergency rebuild override — V24/V40/V41 checksum drift between prod
      # schema_history and the current migration files. Restore to default
      # (true) once `flyway repair` has been run.
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:-true}
      # GDPR Art. 17 / KVKK permanent purge of soft-deleted users >30 days old.
      # Daily cron at 03:30 server time. Operator must run dry-run first via
      # DELETE /api/v1/admin/purge/dry-run before flipping to true.
      APP_PURGE_SOFT_DELETE_ENABLED: ${APP_PURGE_SOFT_DELETE_ENABLED:-false}
      # Config-driven login engine kill-switch (task #16, ships DARK 2026-05-30).
      # Default OFF = byte-identical legacy password-first login. Reversible via
      # .env.prod + `up -d` recreate (no image rebuild). Roll out dark → staging
      # → canary one tenant (set _TENANTS to its UUID) → global (_LOGIN=true).
      APP_AUTH_CONFIG_DRIVEN_LOGIN: ${APP_AUTH_CONFIG_DRIVEN_LOGIN:-false}
      APP_AUTH_CONFIG_DRIVEN_LOGIN_TENANTS: ${APP_AUTH_CONFIG_DRIVEN_LOGIN_TENANTS:-}
      # NFC serial-only login (2026-06-01). MUST be listed here — the service uses an
      # explicit `environment:` block, NOT `env_file:`, so a var only in .env.prod is
      # NOT passed into the container (this exact gap left the flag dead after the
      # 2026-06-01 rebuild). Campus/MIFARE cards have STATIC UIDs and work via serial
      # match; this enables that path. NOTE: passport/eID chip documents emit a RANDOM
      # UID per tap, so serial-match can NEVER match them — those need chip passive-auth
      # (CSCA trust store, currently unprovisioned). Kill-switch: false + `up -d`. No rebuild.
      FIVUCSAS_NFC_SERIAL_ONLY_AUTH_ENABLED: ${FIVUCSAS_NFC_SERIAL_ONLY_AUTH_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: https://api.fivucsas.com,https://app.fivucsas.com,https://demo.fivucsas.com,https://verify.fivucsas.com
      CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS,PATCH
      CORS_ALLOWED_HEADERS: Authorization,Content-Type,X-Tenant-ID,X-Request-ID,Accept
      CORS_MAX_AGE: 3600
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_ALGORITHM: AES/GCM/NoPadding
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_LOGIN_PER_MINUTE: 5
      RATE_LIMIT_API_PER_MINUTE: 100
      MULTITENANCY_ENABLED: "true"
      MULTITENANCY_ISOLATION_LEVEL: ROW_LEVEL
      MULTITENANCY_DEFAULT_TENANT: system
      MULTITENANCY_TENANT_HEADER: X-Tenant-ID
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_APP: INFO
      LOGGING_LEVEL_SECURITY: WARN
      LOGGING_LEVEL_SQL: WARN
      MANAGEMENT_ENDPOINTS_ENABLED: "true"
      MANAGEMENT_HEALTH_SHOW_DETAILS: authorized
      FEATURE_EMAIL_VERIFICATION_ENABLED: "true"
      FEATURE_PHONE_VERIFICATION_ENABLED: "false"
      FEATURE_TWO_FACTOR_AUTH_ENABLED: "false"
      FEATURE_SOCIAL_LOGIN_ENABLED: "false"
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ENABLED: ${MAIL_ENABLED}
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      BIOMETRIC_SERVICE_URL: http://biometric-api:8001/api/v1
      BIOMETRIC_SERVICE_API_KEY: ${BIOMETRIC_API_KEY}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-noop}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identity-api.rule=Host(`api.fivucsas.com`)"
      - "traefik.http.routers.identity-api.entrypoints=websecure"
      - "traefik.http.routers.identity-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.identity-api.middlewares=secure-headers@file,noindex@file,rate-limit@file"
      - "traefik.http.services.identity-api.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 512

networks:
  backend:
    name: backend
    external: true
  proxy:
    name: proxy
    external: true
