# Host-local STAGING for identity-core-api (P1-2 hardening roadmap, 2026-05-29).
#
# Purpose: a non-prod api+DB to run Playwright E2E + adversarial tenant-isolation
# checks + @Filter validation WITHOUT touching prod (and without littering the
# prod tenant list). Deliberately:
#   - reuses the already-built prod image (image:, no rebuild)
#   - uses a SEPARATE database `identity_core_staging` (same shared-postgres) and
#     Redis logical DB 1 — full data isolation from prod
#   - binds ONLY to 127.0.0.1:18080 (no Traefik route → not internet-exposed)
#   - mail disabled (MAIL_ENABLED=false in .env.staging) so E2E never sends real email
#   - a distinct JWT_SECRET (.env.staging) so staging tokens never validate on prod
#
# Run:  docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
# Logs: docker logs identity-core-api-staging
# Down: docker compose -f docker-compose.staging.yml --env-file .env.staging down
services:
  identity-core-api-staging:
    image: identity-core-api-identity-core-api:latest
    container_name: identity-core-api-staging
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/log
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://shared-postgres:5432/identity_core_staging
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: shared-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: 1
      REDIS_TIMEOUT: 5000
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: 3600000
      JWT_REFRESH_TOKEN_EXPIRATION: 604800000
      JWT_ISSUER: rollingcat-identity-core
      JWT_AUDIENCE: rollingcat-clients
      JWT_DEFAULT_ALGO: ${JWT_DEFAULT_ALGO:-HS512}
      JWT_RSA_KID: ${JWT_RSA_KID:-}
      JWT_RSA_PRIVATE_KEY_PEM: ${JWT_RSA_PRIVATE_KEY_PEM:-}
      JWT_RSA_PUBLIC_KEY_PEM: ${JWT_RSA_PUBLIC_KEY_PEM:-}
      FIVUCSAS_TOTP_ENC_KEY: ${FIVUCSAS_TOTP_ENC_KEY:-}
      APP_SECURITY_JWT_ALLOW_HS512: ${APP_SECURITY_JWT_ALLOW_HS512:-true}
      APP_SECURITY_JWT_ISSUER: ${APP_SECURITY_JWT_ISSUER:-}
      APP_SECURITY_JWT_AUDIENCE: ${APP_SECURITY_JWT_AUDIENCE:-}
      WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-http://localhost:18080,http://localhost:5173}
      # Fresh staging DB → full V0..V64 chain applies cleanly; keep validation on.
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
      APP_PURGE_SOFT_DELETE_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:18080,http://localhost:5173,http://localhost:3000
      CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS,PATCH
      CORS_ALLOWED_HEADERS: Authorization,Content-Type,X-Tenant-ID,X-Active-Tenant,X-Request-ID,Accept
      CORS_MAX_AGE: 3600
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_ALGORITHM: AES/GCM/NoPadding
      RATE_LIMIT_ENABLED: "false"
      MULTITENANCY_ENABLED: "true"
      MULTITENANCY_ISOLATION_LEVEL: ROW_LEVEL
      MULTITENANCY_DEFAULT_TENANT: system
      MULTITENANCY_TENANT_HEADER: X-Tenant-ID
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_APP: INFO
      MANAGEMENT_ENDPOINTS_ENABLED: "true"
      MANAGEMENT_HEALTH_SHOW_DETAILS: authorized
      FEATURE_EMAIL_VERIFICATION_ENABLED: "true"
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      # Staging shares the (internal) prod biometric service for read paths;
      # staging E2E focuses on admin/tenant-isolation flows that don't enroll.
      BIOMETRIC_SERVICE_URL: http://biometric-api:8001/api/v1
      BIOMETRIC_SERVICE_API_KEY: ${BIOMETRIC_API_KEY}
      SMS_ENABLED: "false"
      SMS_PROVIDER: noop
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
          pids: 512

networks:
  backend:
    name: backend
    external: true
